[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fgl_benchmark"
version = "0.1.0"
description = "Federated Graph Learning Benchmark"
authors = [{name = "Daniel Cunney", email = "danielcunneyps@gmail.com"}]
dependencies = [
    "flwr[simulation]>=1.13,<2.0",
    "torch",
    "torch-geometric",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "networkx"
]

[tool.hatch.build.targets.wheel]
packages = ["algorithms", "datasets", "utils", "models"]

[tool.flwr.app]
publisher = "cunneyd"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
algorithm = "fedavg"
dataset = "cornell"
num-clients = 10
num-server-rounds = 50
learning-rate = 0.01
local-epochs = 3
mu = 0.01
n_clusters = 2
seed = 360

[tool.flwr.federations]
default = "local-sim"

[tool.flwr.federations.local-sim]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 1
options.backend.ray-init-args = { num_cpus = 6, num_gpus = 0, ignore_reinit_error = true }